<!DOCTYPE html>
<html>
<head>
    <title>Revenue Prediction</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 40px;
        }

        form {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 5px;
        }

        input, button {
            width: 100%;
            padding: 8px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>E-Commerce Revenue Prediction</h2>

    <form>
        <label>Quantity</label>
        <input type="number">

        <label>Unit Price</label>
        <input type="number" step="0.01">

        <label>Discount Applied (0 or 1)</label>
        <input type="number">

        <label>Shipping Cost</label>
        <input type="number" step="0.01">

        <button>Predict Revenue</button>
    </form>
</body>
</html>
